<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Noto Sans TC','Segoe UI',sans-serif">
  <title>Prefill 與 decode 的差別</title>
  <style>
    .t{fill:#e9f0e7;font-size:12.5px}.s{fill:#9db4ac;font-size:10.5px}.m{font-family:'DM Mono',Consolas,monospace;font-size:10.5px;fill:#e9f0e7}
  </style>
  <text class="t" x="20" y="24">Prefill：一次處理整段輸入</text>
  <g fill="#3f7c86"><rect x="20" y="36" width="34" height="28"/><rect x="58" y="36" width="34" height="28"/><rect x="96" y="36" width="34" height="28"/><rect x="134" y="36" width="34" height="28"/><rect x="172" y="36" width="34" height="28"/><rect x="210" y="36" width="34" height="28"/><rect x="248" y="36" width="34" height="28"/><rect x="286" y="36" width="34" height="28"/></g>
  <text class="s" x="20" y="82">N 個 token 同時過模型：權重讀一次，做 N 份矩陣乘法</text>
  <text class="s" x="20" y="98">算術強度高 → 通常是 compute-bound（吃算力）。決定首 token 延遲 TTFT。</text>
  <rect x="20" y="118" width="680" height="1" fill="#9db4ac" fill-opacity=".25"/>
  <text class="t" x="20" y="146">Decode：一次只產生一個 token，一步接一步</text>
  <g>
    <rect x="20" y="158" width="34" height="28" fill="#8d4a3b"/><text class="m" x="60" y="176">→</text>
    <rect x="80" y="158" width="34" height="28" fill="#8d4a3b"/><text class="m" x="120" y="176">→</text>
    <rect x="140" y="158" width="34" height="28" fill="#8d4a3b"/><text class="m" x="180" y="176">→</text>
    <rect x="200" y="158" width="34" height="28" fill="#8d4a3b"/><text class="m" x="240" y="176">→</text>
    <rect x="260" y="158" width="34" height="28" fill="#8d4a3b"/><text class="m" x="300" y="176">…</text>
  </g>
  <rect x="360" y="152" width="340" height="40" rx="4" fill="#143034" stroke="#fc8268"/>
  <text class="s" x="372" y="170">每一步都要把「整份權重 + KV cache」</text>
  <text class="s" x="372" y="184">從記憶體讀一遍，只做很少的運算</text>
  <text class="s" x="20" y="212">算術強度低 → 通常是 memory-bound（吃記憶體頻寬）。決定之後每個 token 的間隔。</text>
  <text class="s" x="20" y="238">→ 增加 batch 讓一次讀取服務多個請求；量化縮小權重位元組；兩者都在對抗頻寬瓶頸。</text>
  <text class="s" x="20" y="262">→ 長 context 會讓每步要讀的 KV cache 變大，decode 因此變慢。</text>
</svg>
