<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="'Noto Sans TC','Segoe UI',sans-serif">
  <title>以原子切換 symlink 部署，健康檢查失敗時切回上一版</title>
  <style>
    .t{fill:#e9f0e7;font-size:12px}.s{fill:#9db4ac;font-size:10.5px}
    .box{fill:#143034;stroke:#9db4ac;stroke-opacity:.6}.cur{fill:#1d4b4b;stroke:#b9f06d}.bad{fill:#3a1f1a;stroke:#fc8268}.arrow{stroke:#9db4ac;stroke-width:1.5;fill:none}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9db4ac"/></marker>
        <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9f06d"/></marker></defs>
  <text class="s" x="20" y="22">releases/ 目錄裡每個版本各自完整；current 只是一個指標</text>
  <g class="t" text-anchor="middle">
    <rect class="box" x="20"  y="50" width="140" height="48" rx="4"/><text x="90" y="72">releases/v1</text><text class="s" x="90" y="88">舊版，保留</text>
    <rect class="cur" x="200" y="50" width="140" height="48" rx="4"/><text x="270" y="72">releases/v2</text><text class="s" x="270" y="88">目前線上版本</text>
    <rect class="bad" x="380" y="50" width="140" height="48" rx="4"/><text x="450" y="72">releases/v3-bad</text><text class="s" x="450" y="88">新版，健康檢查失敗</text>
  </g>
  <rect class="cur" x="200" y="170" width="140" height="40" rx="4"/><text class="t" x="270" y="195" text-anchor="middle">current（symlink）</text>
  <path d="M270 170V100" stroke="#b9f06d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path class="arrow" d="M380 190H345" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text class="s" x="390" y="186">① 先寫 current.new 指向 v3</text>
  <text class="s" x="390" y="202">② mv -T 原子取代 current</text>
  <text class="s" x="390" y="218">③ 健康檢查失敗 → 再切回 v2</text>
  <text class="s" x="20" y="246">任何時刻 current 都指向一個完整的版本，不存在「部署到一半」的狀態；回滾只是再換一次指標。</text>
  <text class="s" x="20" y="262">資料庫結構變更不在這張圖裡：它需要「先擴充、後收斂」，不能靠切 symlink 回滾。</text>
</svg>
