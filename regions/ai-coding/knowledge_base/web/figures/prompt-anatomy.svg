<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Noto Sans TC','Segoe UI',sans-serif">
  <title>一個結構化 prompt 的組成</title>
  <style>
    .t{fill:#e9f0e7;font-size:12.5px}.s{fill:#9db4ac;font-size:10.5px}.arrow{stroke:#9db4ac;stroke-width:1.5;fill:none}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9db4ac"/></marker></defs>
  <rect x="20" y="20" width="400" height="48" fill="#2b6b6b"/><text class="t" x="34" y="42">① 角色與情境</text><text class="s" x="34" y="58">你是誰、專案是什麼、用什麼語言與版本</text>
  <rect x="20" y="72" width="400" height="48" fill="#3f7c86"/><text class="t" x="34" y="94">② 任務與指示</text><text class="s" x="34" y="110">具體要做什麼，拆成步驟，每一步可驗證</text>
  <rect x="20" y="124" width="400" height="48" fill="#4f8f78"/><text class="t" x="34" y="146">③ 範例（few-shot）</text><text class="s" x="34" y="162">示範想要的風格與輸入輸出，也示範邊界</text>
  <rect x="20" y="176" width="400" height="48" fill="#8d6a3b"/><text class="t" x="34" y="198">④ 限制與輸出格式</text><text class="s" x="34" y="214">不要用什麼、必須符合什麼、輸出成什麼結構</text>
  <rect x="20" y="228" width="400" height="48" fill="#8d4a3b"/><text class="t" x="34" y="250">⑤ 驗收標準</text><text class="s" x="34" y="266">怎麼判斷這份輸出算完成（測試、檢查清單）</text>
  <path class="arrow" d="M420 148H476" marker-end="url(#a)"/>
  <rect x="480" y="108" width="220" height="80" rx="4" fill="#1d4b4b" stroke="#b9f06d"/>
  <text class="t" x="590" y="140" text-anchor="middle">模型輸出</text>
  <text class="s" x="590" y="158" text-anchor="middle">仍然是機率性的</text>
  <text class="s" x="590" y="172" text-anchor="middle">所以 ⑤ 要由程式去檢查</text>
  <text class="s" x="480" y="226">限制寫得再清楚也「不保證」被遵守，</text>
  <text class="s" x="480" y="242">所以輸出要驗證（schema、測試、linter）。</text>
</svg>
