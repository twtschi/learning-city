<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Noto Sans TC','Segoe UI',sans-serif">
  <title>從問題到實作的工作流與人工確認點</title>
  <style>
    .t{fill:#e9f0e7;font-size:12px}.s{fill:#9db4ac;font-size:10.5px}
    .box{fill:#143034;stroke:#9db4ac;stroke-opacity:.6}.ai{fill:#1d4b4b;stroke:#b9f06d}.gate{fill:#3a1f1a;stroke:#fc8268}.arrow{stroke:#9db4ac;stroke-width:1.5;fill:none}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9db4ac"/></marker></defs>
  <g class="t" text-anchor="middle">
    <rect class="box" x="10" y="40" width="88" height="48" rx="4"/><text x="54" y="70">問題定義</text>
    <rect class="ai" x="124" y="40" width="88" height="48" rx="4"/><text x="168" y="70">設計文件</text>
    <rect class="ai" x="238" y="40" width="88" height="48" rx="4"/><text x="282" y="70">需求清單</text>
    <rect class="ai" x="352" y="40" width="88" height="48" rx="4"/><text x="396" y="70">User stories</text>
    <rect class="ai" x="466" y="40" width="88" height="48" rx="4"/><text x="510" y="70">Stub 骨架</text>
    <rect class="ai" x="580" y="40" width="88" height="48" rx="4"/><text x="624" y="70">實作與測試</text>
  </g>
  <path class="arrow" d="M98 64H124M212 64H238M326 64H352M440 64H466M554 64H580" marker-end="url(#a)"/>
  <g class="t" text-anchor="middle">
    <rect class="gate" x="124" y="118" width="88" height="34" rx="17"/><text x="168" y="140">人確認取捨</text>
    <rect class="gate" x="238" y="118" width="88" height="34" rx="17"/><text x="282" y="140">問利害關係人</text>
    <rect class="gate" x="466" y="118" width="88" height="34" rx="17"/><text x="510" y="140">骨架先能跑</text>
    <rect class="gate" x="580" y="118" width="88" height="34" rx="17"/><text x="624" y="140">驗收測試通過</text>
  </g>
  <path class="arrow" d="M168 88V118M282 88V118M510 88V118M624 88V118" stroke-dasharray="4 3"/>
  <rect x="10" y="20" width="10" height="10" fill="#1d4b4b" stroke="#b9f06d"/><text class="s" x="26" y="29">AI 起草</text>
  <rect x="88" y="20" width="10" height="10" fill="#3a1f1a" stroke="#fc8268"/><text class="s" x="104" y="29">人的關卡（不能省）</text>
  <text class="s" x="10" y="190">AI 把「從空白頁開始」變成「審稿」，但每一個關卡的簽名仍然是人。</text>
  <text class="s" x="10" y="208">給 agent 的版本：把「需求」寫成驗收測試，讓測試通過成為完成條件。</text>
</svg>
