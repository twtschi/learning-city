<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Noto Sans TC','Segoe UI',sans-serif">
  <title>任務放置矩陣：以驗證成本與爆炸半徑決定 AI 的角色</title>
  <style>
    .t{fill:#e9f0e7;font-size:12px}.s{fill:#9db4ac;font-size:10.5px}.h{fill:#08181b;font-size:13px;font-weight:700}.k{fill:#08181b;font-size:10.5px}
  </style>
  <text class="s" x="16" y="205" transform="rotate(-90 16 205)" text-anchor="middle">爆炸半徑與不可逆程度（低 → 高）</text>
  <text class="s" x="28" y="34" text-anchor="middle">高</text><text class="s" x="28" y="384" text-anchor="middle">低</text>
  <text class="s" x="390" y="410" text-anchor="middle">驗證成本（便宜、可自動 → 昂貴、靠專家或要上線才知道）</text>
  <rect x="40" y="20" width="330" height="180" fill="#e6a85a"/>
  <text class="h" x="52" y="42">受限委派</text><text class="k" x="52" y="60">AI 起草＋自動關卡＋人簽核（階梯 3）</text>
  <text class="k" x="52" y="86">資料庫 schema 遷移（先 dry-run）</text><text class="k" x="52" y="104">部署／維運腳本、告警查詢</text>
  <text class="k" x="52" y="122">有 characterization 測試的遺留重構</text><text class="k" x="52" y="140">依賴與版本升級</text>
  <rect x="380" y="20" width="330" height="180" fill="#fc8268"/>
  <text class="h" x="392" y="42">人主導</text><text class="k" x="392" y="60">AI 當解釋者與審查者（階梯 1–2）</text>
  <text class="k" x="392" y="86">認證、加密、輸入清理</text><text class="k" x="392" y="104">沒有 oracle 的遺留核心邏輯翻譯</text>
  <text class="k" x="392" y="122">金額與捨入語意、併發</text><text class="k" x="392" y="140">授權與隱私的合規判斷、架構決策</text>
  <rect x="40" y="210" width="330" height="180" fill="#6aa27a"/>
  <text class="h" x="52" y="232">委派</text><text class="k" x="52" y="250">以測試與 CI 當完成條件（階梯 3–4）</text>
  <text class="k" x="52" y="276">格式轉換（有 round trip 驗證）</text><text class="k" x="52" y="294">用「產生器」造測試資料</text>
  <text class="k" x="52" y="312">有編譯器保護的改名、extract method</text><text class="k" x="52" y="330">樣板與骨架、單元測試（再驗證強度）</text>
  <rect x="380" y="210" width="330" height="180" fill="#8fc4d0"/>
  <text class="h" x="392" y="232">起草後抽樣</text><text class="k" x="392" y="250">AI 出草稿，人掃讀與抽查（階梯 2–3）</text>
  <text class="k" x="392" y="276">文件、PR 描述、學習筆記</text><text class="k" x="392" y="294">UI 草稿、CSS、圖像素材</text>
  <text class="k" x="392" y="312">使用者回饋摘要（抽樣核對）</text><text class="k" x="392" y="330">命名建議、行銷文案（需事實審查）</text>
</svg>
