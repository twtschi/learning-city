<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <title>Learning City / AI Coding Region</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3" />

<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="../../index.html"><span class="brand-mark"><i></i><i></i><i></i></span><span>LEARNING CITY</span></a>
      <div class="rail-label" id="rail-label"></div>
      <nav class="steps" id="steps" aria-label="課程章節"></nav>

    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <span>REGION · <b>AI CODING</b> · 12 週學習路徑</span>
        <button class="link-btn" id="open-roadmap" type="button">12 週地圖 ↗</button>
      </header>
      <article class="lesson" id="lesson"></article>
    </main>
  </div>

  <dialog id="roadmap">
    <div class="modal">
      <p class="turn">ROADMAP · 12 WEEKS</p>
      <h2>AI Coding 學習路徑</h2>
      <p class="muted" id="roadmap-summary"></p>
      <ol class="roadmap-list" id="roadmap-list"></ol>
      <div class="modal-foot"><button class="btn ghost" id="close-roadmap" type="button">關閉</button></div>
    </div>
  </dialog>
  <script src="knowledge_base/loader.js"></script>
  <script src="knowledge_base/web/catalog.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>

</html>
