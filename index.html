<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081217" />
  <meta name="description" content="Learning City — 今天你想看什麼？你的學習進度會在城市裡蓋出自己的區域。" />
  <title>Learning City — 今天你想看什麼？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Learning City"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>LEARNING <b>CITY</b></span></a>
      <div class="city-meter" aria-label="城市整體進度">
        <span>CITY BUILT</span>
        <span class="meter-track"><i id="city-fill"></i></span>
        <b id="city-pct">0%</b>
      </div>
      <a class="gh" href="https://github.com/twtschi/learning-city" rel="noopener">GitHub ↗</a>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow"><span id="greeting">你好</span> · 今天是 <span id="today"></span></p>
          <h1>今天，<br /><em>你想看什麼？</em></h1>
          <p class="lede">每學完一個關卡，你的區域就多蓋一層、地基就擴大一圈。選一個今天的方向，從上次停下來的地方繼續。</p>

          <div class="intents" role="group" aria-label="今天的學習意圖">
            <button type="button" class="intent on" data-intent="continue"><b>繼續進行中</b><span>接著上次的進度</span></button>
            <button type="button" class="intent" data-intent="new"><b>開一塊新地</b><span>挑一個還沒動工的區域</span></button>
            <button type="button" class="intent" data-intent="review"><b>回頭複習</b><span>檢視已蓋好的區域</span></button>
          </div>

          <article class="pick" id="pick" aria-live="polite"></article>
        </div>

        <div class="map-frame" aria-label="城市地圖：建築大小代表學習進度">
          <div class="map-caption"><span class="live"><i></i>CONSTRUCTION LIVE</span><span class="mono">HEIGHT & FOOTPRINT = PROGRESS</span></div>
          <svg id="city" viewBox="0 0 1000 560" role="img" aria-labelledby="city-title city-desc"></svg>
          <div class="stage-legend" aria-hidden="true">
            <span><i class="lg-lot"></i>空地</span><span><i class="lg-found"></i>地基</span><span><i class="lg-frame"></i>骨架</span><span><i class="lg-wall"></i>外牆</span><span><i class="lg-done"></i>完工</span>
          </div>
        </div>
      </section>

      <section class="regions" id="regions" aria-labelledby="regions-title">
        <div class="section-head"><div><p class="kicker">REGIONS · 學習分區</p><h2 id="regions-title">所有工地</h2></div><p class="note">進度記錄在這個瀏覽器裡；清除網站資料會讓城市回到空地。</p></div>
        <div class="grid" id="grid"></div>
      </section>

      <footer class="foot"><span>LEARNING CITY</span><span class="mono">progress is stored locally in your browser</span></footer>
    </main>
  </div>
  <script src="home.js"></script>
</body>
</html>
